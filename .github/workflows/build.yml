name: Build APK

# - أي push: يبني التطبيق ويرفعه كـ Artifact للتجربة.
# - وسم إصدار مثل v1.0.1: ينشر Release، ويصل إشعار التحديث لكل المستخدمين داخل التطبيق.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HN_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "HN_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::لا يوجد مفتاح توقيع في Secrets. تسجيل الدخول بجوجل والتحديثات تحتاج نسخة موقّعة بمفتاحك."
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "::error::أضف KEYSTORE_BASE64 قبل نشر إصدار"; exit 1; fi
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > haitham-release.jks
          {
            echo "storeFile=../haitham-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Show SHA-1 (for Google Cloud OAuth client)
        if: hashFiles('haitham-release.jks') != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          SHA1=$(keytool -list -v -keystore haitham-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -m1 "SHA1:" | sed 's/.*SHA1: //')
          echo "SHA-1 = $SHA1"
          echo "### بصمة SHA-1 لمفتاح التوقيع" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$SHA1\`" >> "$GITHUB_STEP_SUMMARY"
          echo "انسخها إلى Google Cloud Console > Clients > Android" >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --tests "*ModelTest*" --tests "*FeatureTest*"

      - name: Build APK
        run: |
          ./gradlew assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/HaithamNotes-${HN_VERSION_NAME:-dev}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HaithamNotes-apk
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
